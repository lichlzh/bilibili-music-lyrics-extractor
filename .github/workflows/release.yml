name: Release

# 打 tag（v*）或手动触发：双平台构建并由 electron-builder 直接发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # electron-vite 编译后，交由 electron-builder 在 CI + tag + GH_TOKEN 下直接发布到 GitHub Release
        # （本地 npm run dist 仍带 --publish never，不会误发布）
        run: npm run build && npx electron-builder --publish always
