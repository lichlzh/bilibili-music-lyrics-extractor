name: Release

# 打 tag（v*）或手动触发：双平台分别构建并打包，最后统一发布到 GitHub Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 只构建并打包到 dist/，不在此步骤发布（--publish never）
      # 若仓库设置了 CSC_LINK / CSC_KEY_PASSWORD 密钥（代码签名证书），electron-builder 会自动签名
      - name: Build & package
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/**/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 汇总双平台产物到 dist/
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: List artifacts
        run: ls -R dist

      # 幂等保险：若同 tag 已存在 Release（手动创建/上次失败残留），先删掉再重建
      - name: Remove any existing release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "${GITHUB_REF_NAME}" --yes || true

      # 只上传真正的安装包：排除 win-unpacked / mac 等解包目录，
      # 否则会连带上传 40+ 个应用内部文件，触发 GitHub API 404 导致 softprops 异常退出
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.blockmap
            dist/*.yml
            dist/*.zip
          fail_on_unmatched_files: false
